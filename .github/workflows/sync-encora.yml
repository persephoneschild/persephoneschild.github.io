name: Sync Encora collection

on:
  schedule:
    - cron: '08 2 * * *' # Time
  workflow_dispatch: # manual trigger from the Actions tab

# Needed so the workflow can push the updated CSVs back to the repo.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch collection and wants from Encora
        env:
          ENCORA_API_KEY: ${{ secrets.ENCORA_API_KEY }}
        run: python3 scripts/sync_encora.py

      - name: Commit and push if the CSVs changed
        run: |
          git config user.name "encora-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add collection.csv wants.csv
          # Skip if nothing changed, to avoid an empty commit/Pages rebuild every day.
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Sync collection and wants from Encora"
            git push
          fi
