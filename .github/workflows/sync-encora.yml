name: Sync Encora collection

on:
  schedule:
    # 03:17 UTC daily. Off the hour on purpose, so it's not competing with
    # every other repo's cron jobs that fire exactly on the hour.
    - cron: '17 3 * * *'
  # Lets you trigger a run by hand from the Actions tab, for testing.
  workflow_dispatch:

# Needed so the workflow is allowed to push the updated CSVs back to the repo.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch collection and wants from Encora
        env:
          ENCORA_API_KEY: ${{ secrets.ENCORA_API_KEY }}
        run: python3 scripts/sync_encora.py

      # TEMPORARY - diagnostic only, remove once we've read the output.
      # Prints the raw 'date' object Encora sends for one recording, so we
      # can see how it flags an imprecise/unknown day.
      - name: DEBUG - inspect one recording's date object
        env:
          ENCORA_API_KEY: ${{ secrets.ENCORA_API_KEY }}
        run: python3 scripts/check_encora_date.py

      - name: Commit and push if the CSVs changed
        run: |
          git config user.name "encora-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add collection.csv wants.csv
          # Only commit if something actually changed, so this doesn't create
          # an empty commit (and a Pages rebuild) every single day.
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Sync collection and wants from Encora"
            git push
          fi
